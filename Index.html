<!DOCTYPE html>
<html>
    <style>
        body{
            background-color: pink;
        }

        #box{
            background-color: rgb(24, 163, 184);
            width: 350px;
            height: 350px;
            border-width: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: inset;
            transition: width 2s, height 4s, background-color 3s;
        }
        #box:hover{
            width: 200px;
            height: 200px;
            background-color: lightcoral;
            border-radius: 70px;
        }
    </style>

<body>
<div id="box">
<h1>Hello world!</h1>
<p>This is the first file in my new Git Repo.</p>
<h3>Good Evening</h3>
</div>
</body>
</html>
